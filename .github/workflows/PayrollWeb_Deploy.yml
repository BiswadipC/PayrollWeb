# name
name: Deploy Angular 19 to Azure App Service

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: PayrollWeb
  NODE_VERSION: '22.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Angular source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Debug GitHub OIDC token
      - name: Debug OIDC token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('api://AzureADTokenExchange');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log('=== OIDC CLAIMS ===');
            console.log('Issuer:', payload.iss);
            console.log('Subject:', payload.sub);
            console.log('Audience:', payload.aud);
            console.log('Repository:', payload.repository);
            console.log('Repository ID:', payload.repository_id);
            console.log('Repository Owner ID:', payload.repository_owner_id);
            console.log('Ref:', payload.ref);
            console.log('Event:', payload.event_name);

      # 3. Login to Azure using OIDC
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 4. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # 5. Install Angular dependencies
      - name: Install dependencies
        run: npm ci

      # 6. Build Angular application
      - name: Build Angular application
        run: npm run build -- --configuration production

      # 7. Deploy Angular application to Azure App Service
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./dist/PayrollWeb/browser
